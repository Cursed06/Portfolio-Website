<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#d9381e" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="150" fill="url(#avatarBg)" />
  <circle cx="150" cy="150" r="142" fill="none" stroke="url(#accentRing)" stroke-width="4" stroke-dasharray="8,6" />
  
  <!-- Stylized Monogram / Abstract Portrait -->
  <circle cx="150" cy="120" r="48" fill="#334155" stroke="#475569" stroke-width="2" />
  <path d="M 80 250 C 80 195, 220 195, 220 250 Z" fill="#334155" stroke="#475569" stroke-width="2" />

  <!-- CS and Design dual accent pins -->
  <circle cx="120" cy="115" r="7" fill="#38bdf8" />
  <circle cx="180" cy="115" r="7" fill="#fb7185" />
  
  <rect x="95" y="165" width="110" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="150" y="181" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CS × DESIGN</text>
</svg>
