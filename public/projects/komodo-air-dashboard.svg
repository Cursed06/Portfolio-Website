<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#adminBg)" />

  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Admin Window Frame -->
    <rect width="1080" height="595" rx="16" fill="#0b1320" stroke="#334155" stroke-width="1.5" />

    <!-- Window Top Header -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 1064 0 A 16 16 0 0 1 1080 16 L 1080 48 L 0 48 Z" fill="#060c14" stroke="#1e293b" stroke-width="1" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="110" y="29" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">
      Komodo Air — Control Center &amp; Flight Scheduling Admin
    </text>

    <!-- Admin Top Stats -->
    <g transform="translate(40, 75)">
      <!-- Metric 1 -->
      <rect width="230" height="85" rx="10" fill="#111d2e" stroke="#1e3a5f" stroke-width="1" />
      <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ACTIVE ROUTES</text>
      <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#38bdf8">28 Daily</text>
      <text x="150" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">↑ +4 New</text>

      <!-- Metric 2 -->
      <g transform="translate(255, 0)">
        <rect width="230" height="85" rx="10" fill="#111d2e" stroke="#1e3a5f" stroke-width="1" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">AIRCRAFT FLEET</text>
        <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">14 Jets</text>
        <text x="140" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">B737 &amp; A320</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(510, 0)">
        <rect width="230" height="85" rx="10" fill="#111d2e" stroke="#1e3a5f" stroke-width="1" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">LOAD FACTOR</text>
        <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#10b981">91.4%</text>
        <text x="155" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">Optimal</text>
      </g>

      <!-- Metric 4 -->
      <g transform="translate(765, 0)">
        <rect width="235" height="85" rx="10" fill="#111d2e" stroke="#1e3a5f" stroke-width="1" />
        <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">SECURITY FILTER</text>
        <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#fbbf24">Spring JWT</text>
        <text x="165" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Active</text>
      </g>
    </g>

    <!-- Flight Scheduling Table -->
    <g transform="translate(40, 185)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">
        Live Fleet Schedule &amp; Allocation Table
      </text>

      <rect x="0" y="35" width="1000" height="340" rx="10" fill="#111d2e" stroke="#1e3a5f" stroke-width="1" />
      
      <!-- Table Header -->
      <rect x="0" y="35" width="1000" height="36" rx="10" fill="#0d1827" />
      <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">FLIGHT</text>
      <text x="140" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">AIRCRAFT</text>
      <text x="280" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">ORIGIN ➔ DESTINATION</text>
      <text x="520" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">DEPARTURE</text>
      <text x="680" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">CAPACITY</text>
      <text x="830" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">STATUS</text>

      <!-- Row 1 -->
      <g transform="translate(0, 75)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <text x="24" y="25" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#38bdf8">KA-402</text>
        <text x="140" y="25" fill="#f8fafc">Boeing 737-800</text>
        <text x="280" y="25" font-weight="600" fill="#f8fafc">CGK (Jakarta) ➔ DPS (Bali)</text>
        <text x="520" y="25" fill="#94a3b8">08:30 WIB</text>
        <text x="680" y="25" fill="#f8fafc">178 / 189 (94%)</text>
        <rect x="830" y="10" width="80" height="24" rx="4" fill="#065f46" />
        <text x="846" y="26" font-size="11" font-weight="700" fill="#34d399">On Time</text>
      </g>
      <line x1="20" y1="120" x2="980" y2="120" stroke="#1e3a5f" stroke-width="1" />

      <!-- Row 2 -->
      <g transform="translate(0, 125)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <text x="24" y="25" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#38bdf8">KA-518</text>
        <text x="140" y="25" fill="#f8fafc">Airbus A320-200</text>
        <text x="280" y="25" font-weight="600" fill="#f8fafc">SUB (Surabaya) ➔ CGK (Jakarta)</text>
        <text x="520" y="25" fill="#94a3b8">10:15 WIB</text>
        <text x="680" y="25" fill="#f8fafc">152 / 180 (84%)</text>
        <rect x="830" y="10" width="80" height="24" rx="4" fill="#065f46" />
        <text x="846" y="26" font-size="11" font-weight="700" fill="#34d399">Boarding</text>
      </g>
      <line x1="20" y1="170" x2="980" y2="170" stroke="#1e3a5f" stroke-width="1" />

      <!-- Row 3 -->
      <g transform="translate(0, 175)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <text x="24" y="25" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#38bdf8">KA-210</text>
        <text x="140" y="25" fill="#f8fafc">Boeing 737-800</text>
        <text x="280" y="25" font-weight="600" fill="#f8fafc">DPS (Bali) ➔ LBJ (Labuan Bajo)</text>
        <text x="520" y="25" fill="#94a3b8">13:40 WITA</text>
        <text x="680" y="25" fill="#f8fafc">189 / 189 (100%)</text>
        <rect x="830" y="10" width="80" height="24" rx="4" fill="#0284c7" />
        <text x="846" y="26" font-size="11" font-weight="700" fill="#ffffff">Scheduled</text>
      </g>
      <line x1="20" y1="220" x2="980" y2="220" stroke="#1e3a5f" stroke-width="1" />

      <!-- Row 4 -->
      <g transform="translate(0, 225)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <text x="24" y="25" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#38bdf8">KA-108</text>
        <text x="140" y="25" fill="#f8fafc">Boeing 737 MAX</text>
        <text x="280" y="25" font-weight="600" fill="#f8fafc">CGK (Jakarta) ➔ KNO (Medan)</text>
        <text x="520" y="25" fill="#94a3b8">16:00 WIB</text>
        <text x="680" y="25" fill="#f8fafc">165 / 195 (85%)</text>
        <rect x="830" y="10" width="80" height="24" rx="4" fill="#0284c7" />
        <text x="846" y="26" font-size="11" font-weight="700" fill="#ffffff">Scheduled</text>
      </g>
    </g>

  </g>
</svg>
