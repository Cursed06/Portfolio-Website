<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1329" />
  <!-- Grid -->
  <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1" />
  </pattern>
  <rect width="800" height="450" fill="url(#archGrid)" />

  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="18">SkillUp // Architecture Pipeline</text>
  <text x="40" y="70" fill="#38bdf8" font-family="monospace" font-size="12">End-to-End Multimodal Analysis Flow</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Input -->
  <rect x="50" y="140" width="160" height="180" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="130" y="175" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">CLIENT LAYER</text>
  <text x="130" y="210" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Flutter App</text>
  <text x="130" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">&amp; Next.js Portal</text>
  <rect x="70" y="260" width="120" height="36" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="130" y="283" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">PDF / Repo Ingest</text>

  <!-- Arrow 1 -->
  <path d="M 215 230 L 275 230" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  
  <!-- Box 2: API Gateway -->
  <rect x="280" y="140" width="160" height="180" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <text x="360" y="175" fill="#a5b4fc" font-family="monospace" font-size="11" text-anchor="middle">EDGE BACKEND</text>
  <text x="360" y="210" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Next.js API</text>
  <text x="360" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Stream Orchestration</text>
  <rect x="300" y="260" width="120" height="36" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="360" y="283" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Auth &amp; Sanitizer</text>

  <!-- Arrow 2 -->
  <path d="M 445 230 L 505 230" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Box 3: AI Engine -->
  <rect x="510" y="140" width="240" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="630" y="175" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">AI &amp; EVALUATION</text>
  <text x="630" y="210" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Gemini Pro API</text>
  <text x="630" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Taxonomy Matcher</text>
  <rect x="530" y="260" width="200" height="36" rx="4" fill="#0f172a" stroke="#334155" />
  <text x="630" y="283" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Structured JSON Rubric</text>

  <!-- Bottom Metric Bar -->
  <rect x="50" y="360" width="700" height="50" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="80" y="391" fill="#94a3b8" font-family="monospace" font-size="12">PIPELINE METRIC // Avg Latency: &lt; 2.8s | Streaming Rate: 45 tps | Schema Validation: 100%</text>
</svg>
