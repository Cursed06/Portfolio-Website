<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Blueprint Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" />
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="720" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <circle cx="65" cy="52" r="5" fill="#ef4444" />
  <circle cx="82" cy="52" r="5" fill="#f59e0b" />
  <circle cx="99" cy="52" r="5" fill="#10b981" />
  <text x="130" y="57" fill="#94a3b8" font-family="monospace" font-size="13">skillup-core // ai-readiness-evaluation-pipeline</text>
  
  <!-- Left Panel: Profile & Readiness Score -->
  <rect x="40" y="95" width="280" height="315" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="65" y="125" width="50" height="50" rx="25" fill="url(#blueGrad)" />
  <text x="90" y="156" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">AI</text>
  
  <text x="130" y="145" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">Candidate Profile</text>
  <text x="130" y="165" fill="#38bdf8" font-family="monospace" font-size="12">SWE Intern Target</text>
  
  <!-- Score Gauge -->
  <rect x="65" y="200" width="230" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="80" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">COMPETENCY SCORE</text>
  <text x="80" y="255" fill="#10b981" font-family="monospace" font-weight="bold" font-size="26">94.2 / 100</text>
  <text x="245" y="252" fill="#38bdf8" font-family="monospace" font-size="12">READY</text>
  
  <!-- Competency Bars -->
  <text x="65" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="12">Algorithms &amp; Data Structures</text>
  <rect x="65" y="310" width="230" height="6" rx="3" fill="#334155" />
  <rect x="65" y="310" width="215" height="6" rx="3" fill="#3b82f6" />
  
  <text x="65" y="340" fill="#cbd5e1" font-family="sans-serif" font-size="12">System Design &amp; Architecture</text>
  <rect x="65" y="350" width="230" height="6" rx="3" fill="#334155" />
  <rect x="65" y="350" width="190" height="6" rx="3" fill="#6366f1" />
  
  <text x="65" y="380" fill="#cbd5e1" font-family="sans-serif" font-size="12">Portfolio &amp; Production Code</text>
  <rect x="65" y="390" width="230" height="6" rx="3" fill="#334155" />
  <rect x="65" y="390" width="220" height="6" rx="3" fill="#10b981" />

  <!-- Right Panel: AI Analysis & Actionable Roadmap -->
  <rect x="340" y="95" width="420" height="315" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="365" y="130" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">Gemini Evaluation &amp; Insights</text>
  
  <rect x="365" y="150" width="370" height="65" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
  <text x="380" y="175" fill="#60a5fa" font-family="monospace" font-size="11">&gt; ANALYZING GITHUB REPOS &amp; RESUME...</text>
  <text x="380" y="198" fill="#e2e8f0" font-family="sans-serif" font-size="12">Strong frontend system architecture; recommend adding Raft/Distributed locks.</text>

  <!-- Roadmap Cards -->
  <rect x="365" y="230" width="370" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="390" cy="255" r="10" fill="#10b981" />
  <text x="390" y="259" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✓</text>
  <text x="415" y="250" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="13">Flutter &amp; Cross-Platform UI</text>
  <text x="415" y="268" fill="#64748b" font-family="sans-serif" font-size="11">Verified via portfolio repository code review</text>

  <rect x="365" y="295" width="370" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="390" cy="320" r="10" fill="#3b82f6" />
  <text x="390" y="324" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">→</text>
  <text x="415" y="315" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="13">High-Concurrency API Design</text>
  <text x="415" y="333" fill="#64748b" font-family="sans-serif" font-size="11">Target completion in Week 3</text>

  <rect x="365" y="360" width="370" height="35" rx="6" fill="url(#blueGrad)" />
  <text x="550" y="382" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Generate Targeted Mock Interview</text>
</svg>
