<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#091811" />
  
  <text x="40" y="45" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="18">WWIMS // System Architecture &amp; Data Pipeline</text>
  <text x="40" y="70" fill="#34d399" font-family="monospace" font-size="12">Role-Based Enterprise Portal &amp; Ledger Automation</text>

  <!-- Layer 1 -->
  <rect x="50" y="120" width="200" height="180" rx="8" fill="#142e22" stroke="#10b981" stroke-width="1.5" />
  <text x="150" y="150" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">FRONTEND CLIENT</text>
  <text x="150" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">React &amp; TypeScript</text>
  <text x="150" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Tailwind CSS UI</text>
  <text x="150" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Real-time Weigh Scale Ingest</text>
  <text x="150" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dynamic Pricing Matrix</text>

  <!-- Layer 2 -->
  <rect x="300" y="120" width="200" height="180" rx="8" fill="#142e22" stroke="#3b82f6" stroke-width="1.5" />
  <text x="400" y="150" fill="#60a5fa" font-family="monospace" font-size="11" text-anchor="middle">BACKEND SERVICES</text>
  <text x="400" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Spring Boot 3</text>
  <text x="400" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Spring Security + JWT</text>
  <text x="400" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Transactional Ledger Engine</text>
  <text x="400" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Audit Logs &amp; Export API</text>

  <!-- Layer 3 -->
  <rect x="550" y="120" width="200" height="180" rx="8" fill="#142e22" stroke="#f59e0b" stroke-width="1.5" />
  <text x="650" y="150" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">PERSISTENCE</text>
  <text x="650" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">PostgreSQL DB</text>
  <text x="650" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">ACID Double-Entry Ledger</text>
  <text x="650" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Indexed Transaction Tables</text>
  <text x="650" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Automated Nightly Backups</text>

  <!-- Connectors -->
  <path d="M 250 210 L 300 210" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 500 210 L 550 210" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="50" y="340" width="700" height="50" rx="6" fill="#142e22" stroke="#334155" />
  <text x="80" y="370" fill="#cbd5e1" font-family="monospace" font-size="12">DEPLOYMENT // Docker Compose | NGINX Reverse Proxy | Automated DB Migrations</text>
</svg>
